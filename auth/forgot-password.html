<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tungsten Emulator</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="shortcut icon" href="/assets/img/icon.svg" type="image/x-icon">
</head>
<body class="basicDark">
    <header> <!-- navbar -->
        <ul class="navbar">
                <li class="block1">
                <li class="item">
                    <a href="/">
                        <img src="/assets/img/iconHollow.svg" alt="Icon">
                        Tungsten Emulator
                    </a>
                </li>
            </li>
            <li class="block2">
                <li>
                    <a href="/about" class="item link">
                        About
                    </a>
                </li>
                <li>
                    <a href="/auth/login" class="item link login">
                        Log In
                    </a>
                </li>
                <li>
                    <a href="/auth/signup" class="item link signup">
                        Sign Up
                    </a>
                </li>
            </li>
        </ul>
    </header>
    <div class="flexrow">
        <div id="sideImgBar"></div>
        <main>
            <h1>Forgot your Password?</h1>
            <p>No worries! Enter the email address you signed up with in the box below, and change your password.</p>
            <p id="loginError"></p>
            <form>
                <label required="true">Email:</label>
                <input type="email" id="loginEmail" placeholder="e.g. johndoe@example.com" required>
                <button id="fpSubmit">Confirm</button>
            </form>
            <p style="margin-top: 8px;">Back to <a href="/auth/login" target="_blank" rel="noopener noreferrer">Log In</a></p>
        </main>
    </div>
</body>
<script type="module" src="/js/index.js"></script>
<script type="module" src="/js/server.js"></script>
</html>
