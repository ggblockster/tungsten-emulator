<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tungsten Emulator</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="shortcut icon" href="/assets/img/icon.svg" type="image/x-icon">
</head>
<body class="basicDark">
    <header> <!-- navbar -->
        <ul class="navbar">
                <li class="block1">
                <li class="item">
                    <a href="/">
                        <img src="/assets/img/iconHollow.svg" alt="Icon">
                        Tungsten Emulator
                    </a>
                </li>
            </li>
            <li class="block2">
                <li>
                    <a href="/about" class="item link">
                        About
                    </a>
                </li>
                <li>
                    <a href="/auth/login" class="item link login">
                        Log In
                    </a>
                </li>
                <li>
                    <a href="/auth/signup" class="item link signup">
                        Sign Up
                    </a>
                </li>
            </li>
        </ul>
    </header>
    <div class="flexrow">
        <div id="sideImgBar"></div>
        <main>
            <h1>Reset Password</h1>
            <p id="loginError"></p>
            <form id="rpC">
                <p>Enter the code you received by email below. Can't find it? Check your spam and junk folder(s) just in case.</p>
                <label for="rpCode" required="true">Enter code here:</label>
                <input type="text" id="code" maxlength="8" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" required>
                <button id="codeSubmit" type="button">Continue</button>
            </form>
            <form id="rpInputs">
                <p>Enter the password you would like to use from now on below:</p>
                <label for="rp1" required="true">Password:</label>
                <input type="password" id="rp1" required>
                <label for="rp2" required="true">Confirm Password:</label>
                <input type="password" id="rp2" required>
                <button id="rpSubmit" type="button">Reset Password</button>
            </form>
            <p style="margin-top: 8px;">Back to <a href="/auth/login" target="_blank" rel="noopener noreferrer">Log In</a></p>
        </main>
    </div>
</body>
<script type="module" src="/js/index.js"></script>
<script type="module" src="/js/server.js"></script>
</html>
